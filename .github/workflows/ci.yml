name: CI

on:
  pull_request:
  push:
    branches: [master]

jobs:
  test:
    name: Node tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # No lockfile in this repo, so plain install.
      - run: npm install

      - run: npm test
